#selftest { display: none; white-space: pre-wrap; font-size: 12px; margin: 16px; padding: 10px; background: #111; color: #9f9; }
#selftest.show { display: block; }

@media (max-width: 1100px) { .plan-grid { grid-template-columns: 1fr 1fr; } }
/* phones and narrow windows: stack the demo, plan in one column */
@media (max-width: 899px) {
  .demo-grid { flex-direction: column; align-items: stretch; }
  .stage-col { width: 100%; }
  .phone-col { align-self: center; }
  .plan-grid { grid-template-columns: 1fr; }
  .brand span { display: block; margin-top: 2px; }
  .top { padding: 8px 12px; }
  main { padding: 10px 10px 20px; }
  .host-row { gap: 5px; }
  .pin-grid { display: block; }
}

/* fitted text: overflow goes downwards so it can be measured */
.q-text, .opt .txt, .rv-q, .rv-opt .txt { align-items: safe center; }
.fi { display: block; min-width: 0; overflow-wrap: break-word; }
.pin-side .prompt { flex: 0 0 160px; height: 160px; overflow: hidden; }
.pin-lbl { position: absolute; height: 46px; line-height: 42px; font-size: 28px; font-weight: bold; white-space: nowrap; text-align: center;
  background: rgba(42,15,28,.88); color: #fff; border: 2px solid #fff; border-radius: 10px; overflow: hidden; pointer-events: none; }
.pin-lbl.gold { color: var(--gold); border-color: var(--gold); }

/* ---------- live pages ---------- */
.hidden { display: none !important; }
.practice { position: fixed; top: 0; left: 0; right: 0; z-index: 90; background: #c0392b; color: #fff; font: bold 14px Arial, sans-serif;
  text-align: center; padding: 3px 6px; pointer-events: none; }
body.live-board { background: #2A0F1C; overflow: hidden; width: 100vw; height: 100vh; }
body.live-board .stage-wrap { position: absolute; border-radius: 0; }
.none { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #eadbe2; font: 22px Arial, sans-serif; z-index: 20; }
.lost { position: fixed; inset: 0; z-index: 80; background: rgba(20,5,12,.88); color: #fff; display: flex; align-items: center;
  justify-content: center; font: bold 44px Arial, sans-serif; text-align: center; padding: 20px; }
.stage .lv-join { left: 40px; top: 250px; width: 600px; text-align: center; }
.stage .lv-join h2 { font-size: 52px; margin-bottom: 14px; font-family: Cambria, Georgia, serif; }
.stage .lv-qr { width: 500px; height: 500px; background: #fff; border-radius: 12px; margin: 0 auto; overflow: hidden; }
.stage .lv-qr svg { width: 500px; height: 500px; display: block; }
.stage .lv-code { font-size: 40px; margin-top: 14px; }
.stage .lv-code b { font-size: 60px; letter-spacing: 6px; }
.stage .lv-link { font-size: 26px; color: #eadbe2; margin-top: 6px; word-break: break-all; }
.stage .lv-teams { left: 680px; top: 250px; height: 660px; }
.stage .lv-wait { left: 680px; top: 950px; }
/* ---------- phone ---------- */
body.live-play { background: #2A0F1C; color: #fff; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; margin: 0; }
.pl-app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; max-width: 480px; margin: 0 auto; width: 100%; box-sizing: border-box; }
.pl-badge { position: fixed; top: 0; left: 0; right: 0; z-index: 70; background: #e67e22; color: #1d1d1d; font: bold 14px Arial, sans-serif; text-align: center; padding: 4px; }
.pl-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
.pl-bar b { font-family: Cambria, Georgia, serif; font-size: 22px; color: #C8A05A; }
.pl-chip { border-radius: 12px; padding: 3px 12px; font-size: 16px; font-weight: bold; white-space: nowrap; }
.pl-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 20px; min-width: 0; }
.pl-h { font-family: Cambria, Georgia, serif; font-size: 28px; margin: 8px 0 2px; overflow-wrap: anywhere; }
.pl-p { font-size: 18px; color: #eadbe2; margin: 0; line-height: 1.3; }
.pl-mid { margin-top: 30px; text-align: center; }
.pl-input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 14px 12px; border-radius: 10px; border: 0; min-height: 52px; }
.pl-lbl { font-size: 16px; color: #eadbe2; }
.pl-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pl-teams button { min-height: 64px; border-radius: 12px; border: 4px solid transparent; font-size: 18px; font-weight: bold; cursor: pointer; }
.pl-teams button.sel { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
.pl-go { min-height: 60px; border: 0; border-radius: 14px; background: #C8A05A; color: #1d1d1d; font-size: 22px; font-weight: bold; cursor: pointer; }
.pl-err { color: #ffb3b3; font-size: 16px; min-height: 20px; }
.pl-meta { font-size: 15px; color: #C8A05A; }
.pl-timer { height: 10px; background: rgba(255,255,255,.15); border-radius: 5px; overflow: hidden; }
.pl-timer div { height: 100%; background: #C8A05A; width: 100%; }
.pl-q { font-size: 19px; line-height: 1.25; overflow-wrap: anywhere; }
.pl-opts { display: grid; grid-template-columns: 1fr; gap: 10px; flex: 1 1 auto; grid-auto-rows: minmax(56px, 1fr); }
.pl-opt { display: flex; align-items: center; gap: 12px; border: 3px solid transparent; border-radius: 14px; padding: 6px 14px; color: #fff; text-align: left; cursor: pointer; min-height: 56px; }
.pl-opt.dark { color: #1d1d1d; }
.pl-opt.sel { border-color: #fff; }
.pl-opt:disabled { opacity: .75; cursor: default; }
.pl-opt .l { font-size: 34px; font-weight: bold; flex: 0 0 34px; }
.pl-opt .t { font-size: 17px; font-weight: bold; line-height: 1.2; overflow-wrap: anywhere; min-width: 0; }
.pl-note { min-height: 22px; font-size: 17px; color: #eadbe2; text-align: center; }
.pl-badge2 { align-self: center; padding: 14px 30px; border-radius: 40px; font-size: 30px; font-weight: bold; margin-top: 10px; }
.pl-badge2.ok { background: #5FA35A; } .pl-badge2.bad { background: #C23B63; } .pl-badge2.no { background: #555; }
.pl-big { font-size: 46px; font-weight: bold; text-align: center; }
.pl-mid2 { font-size: 19px; text-align: center; color: #eadbe2; overflow-wrap: anywhere; }
.pl-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.pl-stats div { background: rgba(255,255,255,.08); border-radius: 12px; padding: 10px; text-align: center; }
.pl-stats span { display: block; font-size: 14px; color: #C8A05A; }
.pl-stats b { font-size: 24px; }
/* ---------- host ---------- */
body.live-host { background: #f3f5f8; color: #1D2733; font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 16px; }
.hs-net { position: sticky; top: 0; z-index: 60; background: #c0392b; color: #fff; font-weight: bold; padding: 10px 14px; font-size: 18px; }
.hs-app { max-width: 1100px; margin: 0 auto; padding: 8px 12px; box-sizing: border-box; }
.hs-card { max-width: 480px; margin: 20px auto; background: #fff; border: 1px solid #DDE3E8; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.hs-card h1 { margin: 0; font-family: Cambria, Georgia, serif; color: #7A1F3D; font-size: 28px; }
.hs-card label, .hs-row label { display: flex; flex-direction: column; gap: 4px; font-size: 15px; flex: 1 1 0; min-width: 0; }
.hs-card input, .hs-card select { font-size: 18px; padding: 10px; border: 1px solid #c9d1d9; border-radius: 8px; min-width: 0; box-sizing: border-box; width: 100%; background: #fff; }
.hs-row { display: flex; gap: 10px; }
.hs-err { color: #c0392b; font-weight: bold; min-height: 20px; }
.hs-prim { min-height: 64px; width: 100%; border: 0; border-radius: 12px; background: #7A1F3D; color: #fff; font-size: 26px; font-weight: bold; cursor: pointer; }
.hs-prim:disabled { background: #999; }
.hs-head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; background: #fff; border: 1px solid #DDE3E8; border-radius: 10px; padding: 8px 12px; font-size: 18px; }
.hs-head b { font-size: 26px; letter-spacing: 4px; color: #7A1F3D; }
.hs-main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.hs-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hs-col h2 { margin: 0; font-size: 18px; color: #7A1F3D; }
.hs-row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hs-row2 button, .hs-btns button { min-height: 44px; min-width: 52px; border: 1px solid #c9d1d9; background: #fff; border-radius: 8px; font-size: 16px; cursor: pointer; }
.hs-chk { display: flex; gap: 6px; align-items: center; font-size: 16px; }
.hs-msg { min-height: 22px; color: #7A1F3D; font-weight: bold; }
.hs-info { color: #5a6470; }
.hs-tk { background: #fff; border: 2px solid; border-radius: 10px; padding: 6px 8px; }
.hs-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.hs-btns input { width: 70px; font-size: 16px; padding: 6px; box-sizing: border-box; }
.hs-prev { margin: 10px auto; width: 480px; max-width: calc(100% - 24px); }
.hs-prev .stage-wrap { border-radius: 8px; }
@media (max-width: 700px) { .hs-main { grid-template-columns: 1fr; } .hs-row { flex-wrap: wrap; } }
/* ---- Pin the Region (phone map, host controls) ---- */
.pl-pq { font-size: 21px; font-weight: bold; text-align: center; }

.hs-pin.hidden { display: none; }
.hs-note { margin: 0; font-size: 14px; color: #5a3a46; }

window.BANK={"mcq":[{"id":"m01","topic":"making","q":"Where does the colour of red wine come from?","options":["The skins","The cork","The bottle glass","Added sugar"],"answer":0,"why":"\"Colour comes from the skins.\"","src":"Handbook p6, B Wine in guest words","hb":6},{"id":"m02","topic":"making","q":"In fermentation, what does yeast turn the sugar into?","options":["Water","Alcohol","Vinegar","Colour"],"answer":1,"why":"\"Yeast eats the sugar and makes alcohol.\"","src":"Handbook p6, B Wine in guest words","hb":6},{"id":"m03","topic":"making","q":"Complete the phrase: \"Steel keeps it fresh. Oak makes it ...\"","options":["colder","sparkling","rounder","pink"],"answer":2,"why":"\"Steel keeps it fresh. Oak makes it rounder.\"","src":"Handbook p6, B Wine in guest words","hb":6},{"id":"m04","topic":"making","q":"How is a white wine made?","options":["Skins stay for days","Spirit is added","Grapes are frozen","Juice only, skins removed"],"answer":3,"why":"White: \"Juice only. Skins are removed.\"","src":"Handbook p6, B Wine in guest words","hb":6},{"id":"m05","topic":"making","q":"Where does Champagne get its bubbles?","options":["In the bottle","From added soda water","From the cork","From frozen grapes"],"answer":0,"why":"\"Champagne gets its bubbles in the bottle.\"","src":"Handbook p9, B Wine in guest words","hb":9},{"id":"m06","topic":"making","q":"Which sparkling wine is made in a tank?","options":["Port","Prosecco","Rioja","Commandaria"],"answer":1,"why":"\"Prosecco uses the tank method.\"","src":"Handbook p9, B Wine in guest words","hb":9},{"id":"m07","topic":"making","q":"How does a rosé get its pink colour?","options":["Long ageing in oak","Added spirit","Short time on red skins","Frozen grapes"],"answer":2,"why":"\"The red skins stayed only a short time in the juice.\"","src":"Handbook p7, B Wine in guest words","hb":7},{"id":"m08","topic":"making","q":"A fortified wine, like Port, is strengthened with what?","options":["Added water","Extra bubbles","Lemon juice","Added spirit"],"answer":3,"why":"Fortified wine: \"A wine strengthened with added spirit, like Port.\"","src":"Handbook p47, J Phrase bank and glossary","hb":47},{"id":"m09","topic":"aromas","q":"Primary aromas come from where?","options":["The cork","The grape","The glass","The kitchen"],"answer":1,"why":"\"Primary = grape. Secondary = winemaking. Tertiary = ageing.\"","src":"Handbook p19, B Wine in guest words","hb":19},{"id":"m10","topic":"aromas","q":"Which aroma does Syrah typically give?","options":["Banana","Chocolate","Black pepper","Honey"],"answer":2,"why":"Syrah smells of black pepper: the spice family.","src":"Handbook p19, B Wine in guest words","hb":19},{"id":"m11","topic":"aromas","q":"What does Sauvignon Blanc often smell of?","options":["Leather and smoke","Coffee and chocolate","Vanilla and toast","Grapefruit and fresh grass"],"answer":3,"why":"Sauvignon Blanc: \"Grapefruit, passion fruit, fresh grass.\"","src":"Handbook p19, B Wine in guest words","hb":19},{"id":"m12","topic":"aromas","q":"What does Pinot Noir often smell of?","options":["Strawberry and raspberry","Coffee and chocolate","Smoke and tar","Coconut and toast"],"answer":0,"why":"Pinot Noir: \"Strawberry, raspberry.\"","src":"Handbook p19, B Wine in guest words","hb":19},{"id":"m13","topic":"aromas","q":"Which aromas do oak barrels add?","options":["Lemon and lime","Vanilla and toast","Fresh grass","Rose petals"],"answer":1,"why":"Oak: \"They add vanilla and toast and a rounder feel.\"","src":"Handbook p47, J Phrase bank and glossary","hb":47},{"id":"m14","topic":"aromas","q":"When you smell a wine, what do you name first?","options":["The bottle price","The glass shape","The aroma family","The bottle size"],"answer":2,"why":"\"Name the family first. The detail comes later.\"","src":"Handbook p41, I Tasting","hb":41},{"id":"m15","topic":"aromas","q":"Which of these is an aroma family?","options":["Plastic","Petrol","Soap","Flowers"],"answer":3,"why":"Aroma families: fruit, flowers, herbs, spice, oak, earth.","src":"Handbook p41, I Tasting","hb":41},{"id":"m16","topic":"aromas","q":"What does a wine with cork taint smell like?","options":["Wet cardboard","Fresh flowers","Ripe strawberry","Fresh lemon"],"answer":0,"why":"Cork taint: \"A fault from the cork: a wet cardboard smell.\"","src":"Handbook p47, J Phrase bank and glossary","hb":47},{"id":"m17","topic":"structure","q":"Your mouth waters after a sip. What are you feeling?","options":["Colour","Bubbles","Acidity","The cork"],"answer":2,"why":"\"Acidity. Mouth-water test. Does your mouth water?\"","src":"Handbook p10, B Wine in guest words","hb":10},{"id":"m18","topic":"structure","q":"Your gums feel dry and grippy, like strong tea. What is it?","options":["Sweetness","Bubbles","Colour","Tannin"],"answer":3,"why":"\"Tannin. Tea test. Do your gums feel dry and grippy?\"","src":"Handbook p10, B Wine in guest words","hb":10},{"id":"m19","topic":"structure","q":"A full-bodied wine feels like which kind of milk?","options":["Whole milk","Skimmed milk","Sparkling water","Lemon juice"],"answer":0,"why":"\"Light like skimmed milk, full like whole milk.\"","src":"Handbook p10, B Wine in guest words","hb":10},{"id":"m20","topic":"structure","q":"Which word means \"a touch of sweetness\"?","options":["Tannic","Off-dry","Corked","Oaked"],"answer":1,"why":"Glossary: \"Off-dry. A touch of sweetness.\"","src":"Handbook p47, J Phrase bank and glossary","hb":47},{"id":"m21","topic":"structure","q":"A gentle warmth in the throat comes from what?","options":["Bubbles","Sweetness","Alcohol","Colour"],"answer":2,"why":"Alcohol: \"A gentle warmth in the throat.\"","src":"Handbook p10, B Wine in guest words","hb":10},{"id":"m22","topic":"structure","q":"Instead of \"tannic\", what do you say to a guest?","options":["Sweet and sticky, like honey","Fizzy, like lemonade","Light, like water","Dry and grippy, like strong tea"],"answer":3,"why":"Instead of tannic, say \"Dry and grippy, like strong tea.\"","src":"Handbook p34, G Choosing and presenting","hb":34},{"id":"m23","topic":"structure","q":"Instead of \"high acidity\", what do you say to a guest?","options":["Crisp and mouth-watering","Heavy and syrupy","Dark and smoky","Sweet and sticky"],"answer":0,"why":"Instead of high acidity, say \"Crisp and mouth-watering.\"","src":"Handbook p34, G Choosing and presenting","hb":34},{"id":"m24","topic":"structure","q":"What does tannin love at the table?","options":["Spicy food","Protein and fat","Delicate fish","Lemon sorbet"],"answer":1,"why":"Tannin loves \"Protein and fat. Steak softens tannin.\"","src":"Handbook p10, B Wine in guest words","hb":10},{"id":"m25","topic":"grapes","q":"Which white grape is crisp and zesty, with citrus and green apple?","options":["Merlot","Cabernet Sauvignon","Maratheftiko","Sauvignon Blanc"],"answer":3,"why":"Sauvignon Blanc: \"Crisp and zesty. Citrus and green apple.\"","src":"Handbook p18, B Wine in guest words","hb":18},{"id":"m26","topic":"grapes","q":"Chardonnay is crisp or rich and buttery. What decides it?","options":["Oak","The glass","The label colour","The cork"],"answer":0,"why":"Chardonnay: \"Crisp or rich and buttery, depending on oak.\"","src":"Handbook p18, B Wine in guest words","hb":18},{"id":"m27","topic":"grapes","q":"How do you describe Riesling to a guest?","options":["Dark and peppery","Fresh and floral","Firm and built for steak","Deep, spicy and firm"],"answer":1,"why":"Riesling: \"Fresh and floral. Dry to sweet.\"","src":"Handbook p18, B Wine in guest words","hb":18},{"id":"m28","topic":"grapes","q":"How do you describe Pinot Noir to a guest?","options":["Dark, peppery and bold","Sweet and amber","Light and silky, red berries","Firm and built for steak"],"answer":2,"why":"Pinot Noir: \"Light and silky. Red berries.\"","src":"Handbook p18, B Wine in guest words","hb":18},{"id":"m29","topic":"grapes","q":"Which red grape is soft and plummy, easy to like?","options":["Sauvignon Blanc","Pinot Grigio","Riesling","Merlot"],"answer":3,"why":"Merlot: \"Soft and plummy. Easy to like.\"","src":"Handbook p18, B Wine in guest words","hb":18},{"id":"m30","topic":"grapes","q":"Which red grape is firm, with blackcurrant, built for steak?","options":["Cabernet Sauvignon","Pinot Grigio","Riesling","Xynisteri"],"answer":0,"why":"Cabernet Sauvignon: \"Firm, blackcurrant. Built for steak.\"","src":"Handbook p18, B Wine in guest words","hb":18},{"id":"m31","topic":"grapes","q":"Shiraz is the Australian name for which grape?","options":["Chardonnay","Syrah","Riesling","Pinot Grigio"],"answer":1,"why":"\"Shiraz is the Australian name for Syrah.\"","src":"Handbook p15, B Wine in guest words","hb":15},{"id":"m32","topic":"grapes","q":"Which is true of Pinot Grigio?","options":["Dark, bold and tannic","Sweet and fortified","Light, clean and easy to drink","Deep, spicy and firm"],"answer":2,"why":"Pinot Grigio: \"Light, clean and easy to drink.\"","src":"Handbook p18, B Wine in guest words","hb":18},{"id":"m33","topic":"regions","q":"Which French region makes traditional-method sparkling wine?","options":["Champagne","Rioja","Barossa Valley","Mendoza"],"answer":0,"why":"\"Champagne. Traditional-method sparkling wine.\"","src":"Handbook p13, B Wine in guest words","hb":13},{"id":"m34","topic":"regions","q":"Barossa Valley in Australia is famous for which grape?","options":["Sauvignon Blanc","Shiraz","Pinot Grigio","Xynisteri"],"answer":1,"why":"\"Barossa is Shiraz.\"","src":"Handbook p15, B Wine in guest words","hb":15},{"id":"m35","topic":"regions","q":"Marlborough in New Zealand is famous for which grape?","options":["Malbec","Maratheftiko","Sauvignon Blanc","Shiraz"],"answer":2,"why":"\"Marlborough is the white (Sauvignon Blanc).\"","src":"Handbook p16, B Wine in guest words","hb":16},{"id":"m36","topic":"regions","q":"Argentina is famous for which red grape?","options":["Xynisteri","Riesling","Pinot Grigio","Malbec"],"answer":3,"why":"\"Argentina is Malbec.\"","src":"Handbook p16, B Wine in guest words","hb":16},{"id":"m37","topic":"regions","q":"In which country is Rioja?","options":["Spain","Australia","Chile","New Zealand"],"answer":0,"why":"Spain: \"Rioja. Tempranillo, Garnacha. Oak-aged reds.\"","src":"Handbook p14, B Wine in guest words","hb":14},{"id":"m38","topic":"regions","q":"Most vineyards sit at about which latitude?","options":["Right on the equator","30 to 50 degrees","Near the North Pole","Only in deserts"],"answer":1,"why":"\"Most vineyards sit at about 30 to 50 degrees latitude.\"","src":"Handbook p12, B Wine in guest words","hb":12},{"id":"m39","topic":"regions","q":"Complete the phrase: \"Bordeaux is structured, Burgundy is ...\"","options":["fortified","frozen","elegant","alcohol-free"],"answer":2,"why":"\"Bordeaux is structured, Burgundy is elegant, Champagne is sparkling.\"","src":"Handbook p13, B Wine in guest words","hb":13},{"id":"m40","topic":"regions","q":"Napa Valley in California is best known for which grape?","options":["Xynisteri","Pinot Grigio","Riesling","Cabernet Sauvignon"],"answer":3,"why":"\"Napa for Cabernet Sauvignon.\"","src":"Handbook p15, B Wine in guest words","hb":15},{"id":"m41","topic":"cyprus","q":"What is the island's main white grape?","options":["Malbec","Xynisteri","Merlot","Shiraz"],"answer":1,"why":"Xynisteri: \"The island's main white grape.\"","src":"Handbook p17, B Wine in guest words","hb":17},{"id":"m42","topic":"cyprus","q":"How do you describe Xynisteri to a guest?","options":["Dark, bold and tannic","Heavy and smoky","Light, fresh and lemony","Sweet and amber"],"answer":2,"why":"Xynisteri: \"Light, fresh and lemony.\"","src":"Handbook p17, B Wine in guest words","hb":17},{"id":"m43","topic":"cyprus","q":"What kind of wine is Maratheftiko?","options":["A light sparkling white","A pale rosé","A clear spirit","A bold local red"],"answer":3,"why":"Maratheftiko: \"A bold local red for grilled meat.\"","src":"Handbook p17, B Wine in guest words","hb":17},{"id":"m44","topic":"cyprus","q":"Which words describe Commandaria?","options":["Sweet and amber","Dry and sparkling","Light and lemony","Clear and fizzy"],"answer":0,"why":"Commandaria: \"Sweet and amber, from sun-dried grapes.\"","src":"Handbook p17, B Wine in guest words","hb":17},{"id":"m45","topic":"cyprus","q":"Maratheftiko is a bold local red for which food?","options":["Fruit salad","Grilled meat","Lemon sorbet","Green salad"],"answer":1,"why":"\"A bold local red for grilled meat.\"","src":"Handbook p17, B Wine in guest words","hb":17},{"id":"m46","topic":"cyprus","q":"Guests are on holiday here. What does the handbook say?","options":["Serve only imported wine","Avoid local wine","Let them taste the island","Offer beer only"],"answer":2,"why":"\"Your guests are on holiday here. Let them taste the island.\"","src":"Handbook p17, B Wine in guest words","hb":17},{"id":"m47","topic":"cyprus","q":"What is Zivania?","options":["A sweet red wine","A soft drink","A sparkling wine","A strong, clear grape spirit"],"answer":3,"why":"Zivania: \"A strong, clear traditional spirit distilled from grape pomace.\"","src":"Handbook p22, C Spirits","hb":22},{"id":"m48","topic":"cyprus","q":"Which drink is often called Cyprus's national cocktail?","options":["Brandy Sour","Margarita","Mojito","Bloody Mary"],"answer":0,"why":"\"Brandy Sour. Often called Cyprus's national cocktail.\"","src":"Handbook p22, C Spirits","hb":22},{"id":"m49","topic":"pairing","q":"Complete the rule: \"Light dish, light drink. Rich dish, ...\"","options":["no drink","iced water","full drink","diet cola"],"answer":2,"why":"Weight with weight: \"Light dish, light drink. Rich dish, full drink.\"","src":"Handbook p24, D Food and wine pairing","hb":24},{"id":"m50","topic":"pairing","q":"Complete the pairing rule: \"Acid cuts ...\"","options":["bread","glass","price","fat"],"answer":3,"why":"\"Acid cuts fat. Crisp wines and bubbles refresh fried, creamy and oily food.\"","src":"Handbook p24, D Food and wine pairing","hb":24},{"id":"m51","topic":"pairing","q":"Which drink does the handbook pair with fried calamari?","options":["Prosecco","Port","Commandaria","Brandy"],"answer":0,"why":"Fried, creamy or oily: crisp acidity or bubbles. \"Calamari with Prosecco.\"","src":"Handbook p25, D Food and wine pairing","hb":25},{"id":"m52","topic":"pairing","q":"A guest orders steak. Which wine fits best?","options":["Pinot Grigio","Cabernet Sauvignon","Xynisteri","Sauvignon Blanc"],"answer":1,"why":"Bold and full: Cabernet Sauvignon. Dishes: steak.","src":"Handbook p11, B Wine in guest words","hb":11},{"id":"m53","topic":"pairing","q":"A sweet dessert needs which kind of wine?","options":["A bone-dry, sharp one","A tannic red","One at least as sweet","A salty one"],"answer":2,"why":"Sweet dessert: \"A wine at least as sweet.\"","src":"Handbook p25, D Food and wine pairing","hb":25},{"id":"m54","topic":"pairing","q":"What happens when you serve a tannic red with fish?","options":["It tastes sweeter","It tastes fruitier","Nothing changes","It turns metallic and bitter"],"answer":3,"why":"Tannic red with fish: \"It turns metallic and bitter.\"","src":"Handbook p25, D Food and wine pairing","hb":25},{"id":"m55","topic":"pairing","q":"Loukoumades and sweet pastries go with which local wine?","options":["Commandaria","Rioja","Malbec","Shiraz"],"answer":0,"why":"Loukoumades, sweet pastries: \"Commandaria, served cool.\"","src":"Handbook p26, D Food and wine pairing","hb":26},{"id":"m56","topic":"pairing","q":"Which statement about pairing is true?","options":["Red with meat, always","Guest preference beats every rule","Never pair white with fish","Only beer goes with food"],"answer":1,"why":"\"Pair the structure, not the colour. Guest preference beats every rule.\"","src":"Handbook p24, D Food and wine pairing","hb":24},{"id":"m57","topic":"selling","q":"Complete: \"Because you ordered the sea bass, I ...\"","options":["will bring the bill","cannot help you","need your room key","suggest the Xynisteri"],"answer":3,"why":"\"Because you ordered the sea bass, I suggest the Xynisteri.\"","src":"Handbook p30, F Selling without pressure","hb":30},{"id":"m58","topic":"selling","q":"Which option should you never present first?","options":["The premium option","The menu","A glass of water","The safe choice"],"answer":0,"why":"\"Never present the premium option first.\"","src":"Handbook p34, G Choosing and presenting","hb":34},{"id":"m59","topic":"selling","q":"A guest says \"That is too expensive.\" What is the method?","options":["Argue. Insist. Push.","Agree. Reframe. Offer.","Ignore and walk away","Drop the price at once"],"answer":1,"why":"\"Agree. Reframe. Offer.\" Do not argue. Do not drop the price at once.","src":"Handbook p32, F Selling without pressure","hb":32},{"id":"m60","topic":"selling","q":"Which line is value talk, not price talk?","options":["It is expensive, but good.","The cheapest one is...","Let me bring a small taste.","It is on the list."],"answer":2,"why":"Value talk: \"Let me bring a small taste.\"","src":"Handbook p31, F Selling without pressure","hb":31},{"id":"m61","topic":"selling","q":"What is the strongest value argument there is?","options":["A long speech","A big discount","The bottle price","A tasting pour"],"answer":3,"why":"\"A tasting pour is the strongest value argument there is.\"","src":"Handbook p31, F Selling without pressure","hb":31},{"id":"m62","topic":"selling","q":"What is an up-sell?","options":["Offer a better version","Taking the order away","Removing the wine list","Bringing the bill early"],"answer":0,"why":"Up-sell: \"Offer a better version of what they already consider.\"","src":"Handbook p30, F Selling without pressure","hb":30},{"id":"m63","topic":"selling","q":"A guest clearly says no. What do you do?","options":["Ask again, louder","Smile, thank them, move on","Bring the bottle anyway","Push the reserve list"],"answer":1,"why":"\"Smile, thank them, move on: one no ends the offer.\"","src":"Handbook p32, F Selling without pressure","hb":32},{"id":"m64","topic":"selling","q":"In all-inclusive, how do you describe the upgrade?","options":["The included wine is poor","Expensive, but good","Different, more expressive","Much better than yours"],"answer":2,"why":"\"Never call the included wine poor. Say 'different, more expressive'.\"","src":"Handbook p31, F Selling without pressure","hb":31},{"id":"m65","topic":"service","q":"How do you hold a wine glass?","options":["By the stem or the base","By the rim","By the bowl","With fingers inside"],"answer":0,"why":"\"Hold by the stem or the base. Never by the bowl or the rim.\"","src":"Handbook p35, H Professional service","hb":35},{"id":"m66","topic":"service","q":"Which glass shape suits sparkling wine?","options":["A beer mug","Tall and narrow","A coffee cup","A wide soup bowl"],"answer":1,"why":"Sparkling: \"Tall and narrow. Keeps the bubbles.\"","src":"Handbook p35, H Professional service","hb":35},{"id":"m67","topic":"service","q":"You present the bottle. What do you wait for before opening?","options":["The bill","The dessert order","The host's nod","The chef's signal"],"answer":2,"why":"\"Wait for the nod. Do not open until the host agrees.\"","src":"Handbook p36, H Professional service","hb":36},{"id":"m68","topic":"service","q":"After the tasting pour, who is served last?","options":["The youngest guest","The chef","The manager","The host"],"answer":3,"why":"\"Host tastes first. Then serve the guests clockwise. The host is last.\"","src":"Handbook p37, H Professional service","hb":37},{"id":"m69","topic":"service","q":"Complete the phrase for opening sparkling wine: \"A sigh, not a ...\"","options":["bang","whisper","smile","song"],"answer":0,"why":"\"A sigh, not a bang. Never point the bottle at a person.\"","src":"Handbook p38, H Professional service","hb":38},{"id":"m70","topic":"service","q":"Why decant a young, tannic red?","options":["To make it sparkle","To let it breathe and soften","To add sugar","To make it colder"],"answer":1,"why":"Young, tannic reds: \"To let the wine breathe and soften.\"","src":"Handbook p38, H Professional service","hb":38},{"id":"m71","topic":"service","q":"A guest returns a faulty bottle. What do you do?","options":["Argue that it is fine","Charge for a new one","Thank them and replace it","Ignore the guest"],"answer":2,"why":"\"Listen. Do not argue. Thank the guest.\" Then replace it.","src":"Handbook p39, H Professional service","hb":39},{"id":"m72","topic":"service","q":"Responsible service: what do you always offer?","options":["A free shot","A second bottle","A larger glass","Water and an alcohol-free option"],"answer":3,"why":"\"Always offer water. And an alcohol-free option for everyone.\"","src":"Handbook p39, H Professional service","hb":39},{"id":"m73","topic":"sparkling","q":"Why does Champagne cost more than Prosecco?","options":["It is made in a tank","It uses cheaper grapes","It has gas added","Time, labour and the bottle"],"answer":3,"why":"\"Time, labour and the bottle.\"","src":"Handbook p9, B Wine in guest words","hb":9},{"id":"m74","topic":"sparkling","q":"What does the method decide in sparkling wine?","options":["Bubbles, flavour and price","Only the colour","Only the alcohol level","Only the bottle size"],"answer":0,"why":"\"The method decides the bubbles, the flavour and the price.\"","src":"Handbook p9, B Wine in guest words","hb":9},{"id":"m75","topic":"sparkling","q":"Which grapes make Champagne?","options":["Riesling, Syrah, Malbec","Chardonnay, Pinot Noir, Pinot Meunier","Merlot, Grenache, Tempranillo","Sauvignon Blanc, Viognier, Semillon"],"answer":1,"why":"\"Chardonnay, Pinot Noir, Pinot Meunier.\"","src":"Handbook p13, B Wine in guest words","hb":13},{"id":"m76","topic":"sparkling","q":"How should sparkling wine be opened?","options":["As fast as you can","With a loud pop","A sigh, not a bang","After shaking the bottle"],"answer":2,"why":"\"A sigh, not a bang. Never point the bottle at a person.\"","src":"Handbook p38, H Professional service","hb":38},{"id":"m77","topic":"sparkling","q":"What goes over the cork and cage before you open?","options":["A cloth","A plastic bag","A metal cap","Nothing at all"],"answer":0,"why":"Step two: cover the cork and cage with a cloth.","src":"Handbook p38, H Professional service","hb":38},{"id":"m78","topic":"sparkling","q":"Why chill a bottle of sparkling wine well before opening?","options":["It sets the cork","It adds more bubbles","It makes the wine sweeter","A warm bottle foams"],"answer":3,"why":"\"A warm bottle foams and is unsafe.\"","src":"Handbook p38, H Professional service","hb":38},{"id":"m79","topic":"sparkling","q":"How is sparkling wine best served?","options":["At room temperature","Cold, in an ice bucket","Warm, in a decanter","Frozen in the freezer"],"answer":1,"why":"Sparkling and sweet wines go cold, in an ice bucket.","src":"Handbook p36, H Professional service","hb":36},{"id":"m80","topic":"sparkling","q":"What does Brut mean on a sparkling wine?","options":["A sweet dessert wine","A light red wine","A dry sparkling wine","An aged brandy"],"answer":2,"why":"Brut: \"A dry sparkling wine.\"","src":"Handbook p47, Glossary","hb":47},{"id":"m81","topic":"dishes","q":"Which wine suits grilled sea bream with lemon?","options":["Xynisteri","Maratheftiko","Commandaria","A tannic Cabernet"],"answer":0,"why":"Sea bream with lemon: \"Xynisteri or a crisp, unoaked white.\"","src":"Handbook p26, D Food and wine pairing","hb":26},{"id":"m82","topic":"dishes","q":"What goes best with slow-roasted kleftiko?","options":["A light, crisp white","A bold red","A sweet dessert wine","A fresh, fruity white"],"answer":1,"why":"Kleftiko: \"a bold red, Cabernet, Shiraz, Maratheftiko.\"","src":"Handbook p26, D Food and wine pairing","hb":26},{"id":"m83","topic":"dishes","q":"Which wine suits halloumi and salad?","options":["A bold, tannic red","A rich, oaky white","Crisp Xynisteri or dry rosé","A sweet dessert wine"],"answer":2,"why":"Halloumi and salad: \"crisp Xynisteri or a dry rosé.\"","src":"Handbook p26, D Food and wine pairing","hb":26},{"id":"m84","topic":"dishes","q":"Which wines suit a shared meze?","options":["Only heavy reds","Only sweet wines","A strong spirit","Sparkling or dry rosé"],"answer":3,"why":"Meze: \"sparkling or dry rosé.\"","src":"Handbook p26, D Food and wine pairing","hb":26},{"id":"m85","topic":"dishes","q":"Which Cyprus red suits souvla?","options":["Xynisteri","Commandaria","A light white","Maratheftiko"],"answer":3,"why":"Souvla: \"medium to bold red such as Maratheftiko.\"","src":"Handbook p26, D Food and wine pairing","hb":26},{"id":"m86","topic":"dishes","q":"Which wine goes with a spicy curry?","options":["A tannic red","A strong, oaky white","Off-dry Riesling","A heavy Cabernet"],"answer":2,"why":"Spicy food: low alcohol, a little sweetness. Off-dry Riesling.","src":"Handbook p25, D Food and wine pairing","hb":25},{"id":"m87","topic":"dishes","q":"What should a wine for fish and seafood have?","options":["High alcohol, strong tannin","High acidity, low tannin","Heavy oak, full body","Sweetness, low acidity"],"answer":1,"why":"Fish and seafood: \"high acidity, low tannin.\"","src":"Handbook p25, D Food and wine pairing","hb":25},{"id":"m88","topic":"dishes","q":"A guest avoids alcohol. What can you offer?","options":["An alcohol-free spritz","A weaker cocktail","A small glass of wine","Nothing, to avoid fuss"],"answer":0,"why":"Beyond wine: sparkling water with citrus, or an alcohol-free spritz.","src":"Handbook p26, D Food and wine pairing","hb":26}],"pins":[{"id":"p01","map":"france","marker":"Bordeaux","prompt":"Pin: Bordeaux"},{"id":"p02","map":"france","marker":"Burgundy","prompt":"Pin: Burgundy"},{"id":"p03","map":"france","marker":"Champagne","prompt":"Pin: Champagne"},{"id":"p04","map":"france","marker":"Rhone","prompt":"Pin: Rhone"},{"id":"p05","map":"france","marker":"Loire","prompt":"Pin: Loire"},{"id":"p06","map":"italy","marker":"Tuscany","prompt":"Pin: Tuscany"},{"id":"p07","map":"italy","marker":"Piedmont","prompt":"Pin: Piedmont"},{"id":"p08","map":"italy","marker":"Veneto","prompt":"Pin: Veneto"},{"id":"p09","map":"iberia","marker":"Rioja","prompt":"Pin: Rioja"},{"id":"p10","map":"iberia","marker":"Douro","prompt":"Pin: Douro"},{"id":"p11","map":"germany_austria","marker":"Mosel","prompt":"Pin: Mosel"},{"id":"p12","map":"usa_west","marker":"Napa Valley","prompt":"Pin: Napa Valley"},{"id":"p13","map":"australia","marker":"Barossa Valley","prompt":"Pin: Barossa Valley"},{"id":"p14","map":"australia","marker":"Margaret River","prompt":"Pin: Margaret River"},{"id":"p15","map":"new_zealand","marker":"Marlborough","prompt":"Pin: Marlborough"},{"id":"p16","map":"south_africa","marker":"Stellenbosch","prompt":"Pin: Stellenbosch"},{"id":"p17","map":"south_america","marker":"Mendoza","prompt":"Pin: Mendoza"},{"id":"p18","map":"greece_cyprus","marker":"Santorini","prompt":"Pin: Santorini"},{"id":"p19","map":"greece_cyprus","marker":"Limassol hills","prompt":"Pin: Limassol hills"}],"pair":[{"id":"f01","topic":"felici","q":"The guest ordered grilled sea bream with lemon. Which glass do you suggest?","options":["Xynisteri, Vasilikon (Cyprus)","Malbec, Lagarde","Primitivo, Feudi di San Gregorio","Maratheftiko, Nelion (Cyprus)"],"answer":0,"why":"Delicate white fish needs a crisp, light white. Red tannin would clash.","src":"Felici wine list, by the glass"},{"id":"f02","topic":"felici","q":"The guest ordered fresh oysters on ice. Which glass do you suggest?","options":["Primitivo, Feudi di San Gregorio","Chablis, Brocard","Valpolicella, Zenato","Malbec, Lagarde"],"answer":1,"why":"Oysters taste of the sea. Dry, mineral Chablis matches that freshness.","src":"Felici wine list, by the glass"},{"id":"f03","topic":"felici","q":"The guest ordered melon with prosciutto. Which glass do you suggest?","options":["Malbec, Lagarde","Maratheftiko, Nelion (Cyprus)","Prosecco Extra Dry, Astoria","Primitivo, Feudi di San Gregorio"],"answer":2,"why":"Sweet melon and salty ham suit light, fruity bubbles. Big reds would clash.","src":"Felici wine list, by the glass"},{"id":"f04","topic":"felici","q":"The guest ordered tuna salad with olives, egg and green beans. Which glass do you suggest?","options":["Malbec, Lagarde","Primitivo, Feudi di San Gregorio","Maratheftiko, Nelion (Cyprus)","Rosé, M de Minuty"],"answer":3,"why":"A cold tuna salad suits a dry, fresh rosé. Heavy reds would overpower it.","src":"Felici wine list, by the glass"},{"id":"f05","topic":"felici","q":"The guest ordered caviar on blinis with sour cream. Which glass do you suggest?","options":["Champagne Brut, Drappier","Valpolicella, Zenato","Maratheftiko, Nelion (Cyprus)","Primitivo, Feudi di San Gregorio"],"answer":0,"why":"Salty, rich caviar needs high acidity and fine bubbles. Red wine tastes metallic.","src":"Felici wine list, by the glass"},{"id":"f06","topic":"felici","q":"The guest ordered a warm goat cheese salad with herbs. Which glass do you suggest?","options":["Malbec, Lagarde","Sauvignon Blanc, Black Cottage","Primitivo, Feudi di San Gregorio","Maratheftiko, Nelion (Cyprus)"],"answer":1,"why":"Tangy goat cheese loves zesty, grassy Sauvignon Blanc. Big reds overpower it.","src":"Felici wine list, by the glass"},{"id":"f07","topic":"felici","q":"The guest ordered grilled halloumi with lemon. Which glass do you suggest?","options":["Malbec, Lagarde","Primitivo, Feudi di San Gregorio","Xynisteri, Vasilikon (Cyprus)","Maratheftiko, Nelion (Cyprus)"],"answer":2,"why":"Salty halloumi needs fresh acidity. A crisp local white cuts through it.","src":"Felici wine list, by the glass"},{"id":"f08","topic":"felici","q":"The guest ordered Dover sole in butter sauce. Which glass do you suggest?","options":["Malbec, Lagarde","Primitivo, Feudi di San Gregorio","Maratheftiko, Nelion (Cyprus)","Chablis, Brocard"],"answer":3,"why":"Rich butter sauce needs a dry, mineral white to cut through it.","src":"Felici wine list, by the glass"},{"id":"f09","topic":"felici","q":"The guest ordered fried ch <script>
'use strict';
/* ===== Core helpers, data and constants ===== */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

/** HTML-escape a value for innerHTML templates. */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/** Small deterministic PRNG (mulberry32). */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/** PRNG seeded from a list of numbers, so each question/round repeats exactly. */
function rngFor() {
  var h = 2166136261;
  for (var i = 0; i < arguments.length; i++) { h = Math.imul(h ^ (arguments[i] * 2654435761 >>> 0), 16777619); }
  return mulberry32(h >>> 0);
}
function shuffled(arr, rnd) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function gauss(rnd) { return Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(2 * Math.PI * rnd()); }

function fmt(n) { return Math.round(n).toLocaleString('en-GB'); }
function ordinal(n) {
  var s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

var BANK = window.BANK || { mcq: [], cards: [], pins: [] };
BANK.mcq = (BANK.mcq || []).filter(function (q) { return q && q.options && q.options.length === 4; });
BANK.cards = BANK.cards || [];
BANK.pins = BANK.pins || [];
BANK.pair = (BANK.pair || []).filter(function (q) { return q && q.options && q.options.length === 4; });
BANK.glasses = BANK.glasses || [];

var TEAMS = [
  { name: 'Merlot', color: '#C23B63', dark: false },
  { name: 'Chardonnay', color: '#E0B840', dark: true },
  { name: 'Sauvignon', color: '#5FA35A', dark: false },
  { name: 'Syrah', color: '#6C7FD9', dark: false }
];
var OPT_COLORS = ['#C23B63', '#4F86D9', '#E0B840', '#5FA35A'];
var OPT_DARK = [false, false, true, false];
var LETTERS = ['A', 'B', 'C', 'D'];
var BOT_NAMES = ['Maria', 'Andreas', 'Elena', 'Nikos', 'Christina', 'Giorgos', 'Anna', 'Petros', 'Sofia', 'Michalis',
  'Katerina', 'Yiannis', 'Eleni', 'Marios', 'Despina', 'Stavros', 'Ioanna', 'Alexis', 'Natalia', 'Panayiotis'];

var ROUNDS = [
  { name: 'Wine basics', topics: ['making', 'aromas', 'structure', 'grapes'] },
  { name: 'Regions and grapes', topics: ['regions', 'cyprus'] },
  { name: 'Selling and service', topics: ['selling', 'pairing', 'service', 'tasting', 'spirits'] },
  { name: 'Champagne and sparkling', topics: ['sparkling'] },
  { name: 'Pairing practice', topics: ['dishes'] },
  { name: 'Mixed', topics: null }
];
var Q_PER_ROUND = 8;
/** The round title on the projector; the live pairing game replaces this function. */
function roundName() { return ROUNDS[G.roundIdx].name; }
var RULES_LINE = 'Correct 100 + speed up to 50 + streak up to 50. Team score = average per player.';

/** 20 seeded bots (5 per team) plus "You" (player 21, Sauvignon). */
function makeRoster() {
  var rnd = rngFor(42);
  var list = BOT_NAMES.map(function (n, i) {
    return { id: i, name: n, team: i % 4, acc: 0.55 + rnd() * 0.30, bot: true };
  });
  list.push({ id: 20, name: 'You', team: 2, acc: 0.75, bot: false, you: true });
  list.forEach(function (p) { p.score = 0; p.streak = 0; p.best = 0; p.last = null; });
  return list;
}

/** The questions of a round: 8 from the round's topics (seeded), topped up from the rest. */
function pickQuestions(roundIdx) {
  var r = ROUNDS[roundIdx], rnd = rngFor(7, roundIdx);
  var pool = BANK.mcq.filter(function (q) { return !r.topics || r.topics.indexOf(q.topic) >= 0; });
  var rest = BANK.mcq.filter(function (q) { return pool.indexOf(q) < 0; });
  var list = shuffled(pool, rnd).concat(shuffled(rest, rnd));
  return list.slice(0, Math.min(Q_PER_ROUND, list.length));
}

/**
 * Shrink an element's font size until its content fits its box.
 * Works on the unscaled design size, so it is independent of the stage scale.
 */
function fitText(el, max, min) {
  if (!el) return;
  var size = max, inner = el.querySelector('.fi') || el;
  function over() {
    return el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1 ||
      (inner !== el && (inner.offsetHeight > el.clientHeight + 1 || inner.offsetWidth > el.clientWidth + 1));
  }
  el.style.fontSize = size + 'px';
  while (size > min && over()) {
    size -= 2;
    el.style.fontSize = size + 'px';
  }
}

/** Parse "#tab=demo&step=board" style hashes. */
function parseHash() {
  var out = {};
  (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
    if (!kv) return;
    var p = kv.split('=');
    out[decodeURIComponent(p[0])] = p.length > 1 ? decodeURIComponent(p[1]) : true;
  });
  return out;
}

/** A fake QR-like SVG pattern (no data encoded). */
function fakeQR() {
  var n = 25, rnd = rngFor(99), cells = '';
  function finder(x, y) {
    return '<rect x="' + x + '" y="' + y + '" width="7" height="7"/><rect x="' + (x + 1) + '" y="' + (y + 1) +
      '" width="5" height="5" fill="#fff"/><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3"/>';
  }
  for (var y = 0; y < n; y++) {
    for (var x = 0; x < n; x++) {
      var inFinder = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
      if (!inFinder && rnd() < 0.5) cells += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
    }
  }
  return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" fill="#2A0F1C">' + cells +
    finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7) + '</svg>';
}

/** Scale a fixed-size design box (stage 1920x1080, phone 390x800) into its wrapper. */
function scaleInto(wrap, inner, w, h, scale) {
  wrap.style.width = Math.floor(w * scale) + 'px';
  wrap.style.height = Math.floor(h * scale) + 'px';
  inner.style.transform = 'scale(' + scale + ')';
}

/* ===== Quiz game engine (shared by stage, phone and host) ===== */
var G = {
  phase: 'lobby',      // lobby | question | reveal | board | podium
  view: 'quiz',        // quiz | tasks (task scoreboard on the stage)
  roundIdx: 0, T: 20, qs: [], qi: 0,
  elapsed: 0, phaseT: 0, paused: false, speed: 1, auto: false, savedT: 30,
  players: makeRoster(), youJoined: false, tasks: [0, 0, 0, 0],
  plan: [], answers: {}, stats: null, prevOrder: [0, 1, 2, 3], version: 0
};

function you() { return G.players[20]; }
function activePlayers() { return G.players.filter(function (p) { return p.bot || G.youJoined; }); }
function curQ() { return G.qs[G.qi]; }
function changed() { G.version++; renderAll(); }

/** Back to the lobby, keeping host settings (time, round). */
function resetGame() {
  G.phase = 'lobby'; G.view = 'quiz'; G.qi = 0; G.qs = []; G.elapsed = 0; G.phaseT = 0;
  G.paused = false; G.auto = false; G.speed = 1; G.T = G.savedT;
  G.players = makeRoster(); G.youJoined = false; G.tasks = [0, 0, 0, 0];
  G.answers = {}; G.plan = []; G.stats = null; G.prevOrder = [0, 1, 2, 3];
  changed();
}

function joinYou(name, team) {
  var p = you();
  p.name = (name || 'You').trim().slice(0, 14) || 'You';
  p.team = team;
  G.youJoined = true;
  changed();
}

function startGame() {
  if (!G.youJoined) joinYou(you().name, you().team);
  G.qs = pickQuestions(G.roundIdx);
  G.qi = 0;
  if (!G.qs.length) return;
  startQuestion();
}

/** Seeded bot answers for the current question. */
function botPlan() {
  var q = curQ(), rnd = rngFor(G.roundIdx, G.qi, 11);
  return G.players.filter(function (p) { return p.bot; }).map(function (p) {
    var ok = rnd() < p.acc;
    var wrong = [0, 1, 2, 3].filter(function (i) { return i !== q.answer; });
    var opt = ok ? q.answer : wrong[Math.floor(rnd() * 3)];
    var t = (2 + rnd() * 12) * Math.min(1, G.T / 16);
    return { pid: p.id, opt: opt, t: Math.round(t * 10) / 10 };
  }).sort(function (a, b) { return a.t - b.t; });
}

function startQuestion() {
  G.phase = 'question'; G.view = 'quiz';
  G.elapsed = 0; G.phaseT = 0; G.answers = {}; G.stats = null;
  G.plan = botPlan();
  changed();
}

function answerCount() { return Object.keys(G.answers).length; }
function allAnswered() { return answerCount() >= activePlayers().length; }

/** Called by the phone when "You" taps A/B/C/D. */
function youAnswer(opt) {
  if (G.phase !== 'question' || G.answers[20] || !G.youJoined) return;
  G.answers[20] = { opt: opt, t: Math.round(G.elapsed * 10) / 10 };
  changed();
  if (allAnswered()) reveal();
}

/** Team totals: quiz = average of the team's players, tasks = manual points. */
function teamStats() {
  var act = activePlayers();
  return TEAMS.map(function (t, i) {
    var mem = act.filter(function (p) { return p.team === i; });
    var sum = mem.reduce(function (s, p) { return s + p.score; }, 0);
    var quiz = mem.length ? Math.round(sum / mem.length) : 0;
    return { i: i, team: t, members: mem.length, quiz: quiz, tasks: G.tasks[i], total: quiz + G.tasks[i] };
  });
}
function teamOrder() {
  return teamStats().slice().sort(function (a, b) { return b.total - a.total || a.i - b.i; }).map(function (s) { return s.i; });
}
function playerRanking() {
  return activePlayers().slice().sort(function (a, b) { return b.score - a.score || a.id - b.id; });
}

/** Score the current question and show the answers. */
function reveal() {
  if (G.phase !== 'question') return;
  var q = curQ();
  G.prevOrder = teamOrder();
  // bots that would have answered by now (the host may reveal early)
  G.plan.forEach(function (a) { if (!G.answers[a.pid] && a.t <= G.elapsed) G.answers[a.pid] = { opt: a.opt, t: a.t }; });
  var counts = [0, 0, 0, 0], fastest = null, n = 0;
  activePlayers().forEach(function (p) {
    var a = G.answers[p.id];
    var pts = 0, ok = !!a && a.opt === q.answer;
    if (a) { counts[a.opt]++; n++; }
    if (ok) {
      p.streak++;
      p.best = Math.max(p.best, p.streak);
      pts = 100 + Math.round(50 * Math.max(0, G.T - a.t) / G.T) + Math.min(50, 10 * (p.streak - 1));
      if (!fastest || a.t < fastest.t) fastest = { p: p, t: a.t };
    } else {
      p.streak = 0;
    }
    p.score += pts;
    p.last = { opt: a ? a.opt : -1, t: a ? a.t : null, pts: pts, ok: ok };
  });
  G.stats = { counts: counts, n: n, fastest: fastest };
  G.phase = 'reveal'; G.phaseT = 0;
  changed();
}

function showBoard() {
  if (G.phase === 'question') reveal();
  if (G.phase !== 'reveal' && G.phase !== 'board') return;
  G.phase = 'board'; G.phaseT = 0; G.view = 'quiz';
  changed();
}

/** Next question (scores the current one silently if still open); podium after the last. */
function nextQuestion() {
  if (G.phase === 'lobby') { startGame(); return; }
  if (G.phase === 'podium') return;
  if (G.phase === 'question') reveal();
  if (G.qi + 1 >= G.qs.length) { G.prevOrder = teamOrder(); G.phase = 'podium'; G.phaseT = 0; G.auto = false; changed(); return; }
  G.qi++;
  startQuestion();
}

/** Real-time tick; dt in seconds. */
function tick(dt) {
  if (G.paused || G.view === 'tasks') return;
  var d = dt * G.speed;
  G.phaseT += d;
  if (G.phase === 'question') {
    G.elapsed = Math.min(G.T, G.elapsed + d);
    var before = answerCount();
    G.plan.forEach(function (a) { if (!G.answers[a.pid] && a.t <= G.elapsed) G.answers[a.pid] = { opt: a.opt, t: a.t }; });
    if (G.elapsed >= G.T || allAnswered()) { reveal(); return; }
    updateQuestionLive(before !== answerCount());
    return;
  }
  if (!G.auto) return;
  if (G.phase === 'lobby') startGame();
  else if (G.phase === 'reveal' && G.phaseT >= 2.2) showBoard();
  else if (G.phase === 'board' && G.phaseT >= 1.3) nextQuestion();
}

/** "Play demo automatically": a full 8-question round with 8 s timers. */
function toggleAuto() {
  if (G.auto) { G.auto = false; G.T = G.savedT; changed(); return; }
  if (G.phase === 'podium') resetGame();
  G.auto = true; G.paused = false; G.T = G.savedT;   // the Time box decides: pick 10 s for a quick look
  if (G.phase === 'lobby') startGame(); else changed();
}

function addTask(team, pts) {
  G.tasks[team] = Math.max(0, G.tasks[team] + pts);
  changed();
}

/**
 * Jump straight to a state with the seeded bots (for review and screenshots):
 * lobby | question | reveal | board | tasks | podium. Uses Round 2, question 4.
 */
function jumpTo(step) {
  G.savedT = 20;
  resetGame();
  if (step === 'lobby') return;
  G.roundIdx = 1; setRoundSelect();
  startGame();
  var stopAt = step === 'podium' ? G.qs.length : Math.min(3, G.qs.length - 1);
  var rnd = rngFor(5);
  function playOut(withYou) {
    if (withYou) {
      var q = curQ(), ok = rnd() < 0.75;
      G.answers[20] = { opt: ok ? q.answer : (q.answer + 1) % 4, t: Math.round((3 + rnd() * 8) * 10) / 10 };
    }
    G.elapsed = G.T;
    G.plan.forEach(function (a) { G.answers[a.pid] = { opt: a.opt, t: a.t }; });
    reveal();
  }
  for (var i = 0; i < stopAt; i++) { playOut(true); if (i < G.qs.length - 1) nextQuestion(); }
  if (step === 'podium') { G.tasks = [12, 9, 14, 11]; nextQuestion(); return; }
  if (step === 'question') {
    G.elapsed = 9;
    G.plan.forEach(function (a) { if (a.t <= 9) G.answers[a.pid] = { opt: a.opt, t: a.t }; });
    G.paused = true;
    changed();
    return;
  }
  playOut(true);
  if (step === 'board' || step === 'tasks') { G.tasks = [12, 9, 14, 11]; showBoard(); }
  if (step === 'tasks') { G.view = 'tasks'; changed(); }
}

/* ===== Game 2: Pin the Region ===== */
var PIN_MAPS = ['australia', 'france', 'italy', 'iberia', 'south_america'];
var P = { phase: 'intro', round: 0, rounds: [], T: 20, elapsed: 0, hold: false, pins: {}, plan: [],
  totals: {}, result: null, key: '' };

/** The five default places, in order: Cyprus, Greece, Champagne, Burgundy, then one outside Europe. */
var PIN_PLAN = [['greece_cyprus', 'Limassol hills'], ['greece_cyprus', 'Santorini'], ['france', 'Champagne'], ['france', 'Burgundy'], ['australia', 'Barossa Valley']];

/** Five places from the plan above (content file), then one per default map, with safe fallbacks. */
function pinRounds() {
  var maps = window.MAPS || {}, out = [];
  function valid(p) { return p && maps[p.map] && window.MAPIMG[p.map] && maps[p.map].markers[p.marker] && maps[p.map].bbox; }
  PIN_PLAN.forEach(function (pl) {
    var p = BANK.pins.filter(function (x) { return x.map === pl[0] && x.marker === pl[1] && valid(x); })[0];
    if (p && out.indexOf(p) < 0) out.push(p);
  });
  PIN_MAPS.forEach(function (m) {
    if (out.length >= 5) return;
    var p = BANK.pins.filter(function (x) { return x.map === m && valid(x) && out.indexOf(x) < 0; })[0];
    if (!p && maps[m]) {
      var mk = Object.keys(maps[m].markers)[0];
      if (mk) p = { map: m, marker: mk, prompt: 'Pin: ' + mk };
    }
    if (valid(p) && out.indexOf(p) < 0) out.push(p);
  });
  BANK.pins.forEach(function (p) { if (out.length < 5 && valid(p) && out.indexOf(p) < 0) out.push(p); });
  return out;
}

function pinItem() { return P.rounds[P.round]; }
function pinMeta() { return window.MAPS[pinItem().map]; }

/** Distance as a fraction of the map width, km estimate and points. */
function pinScore(px, py) {
  var it = pinItem(), m = pinMeta(), t = m.markers[it.marker];
  var d = Math.sqrt(Math.pow(px - t.x, 2) + Math.pow((py - t.y) * m.h / m.w, 2));
  var pct = d * 100;
  var pts = pct <= 8 ? 100 : pct >= 50 ? 0 : Math.round(100 * (50 - pct) / 42);   // forgiving: within 8 percent of the map width is full marks
  var b = m.bbox, mid = (b[2] + b[3]) / 2 * Math.PI / 180;
  var km = d * (b[1] - b[0]) * 111 * Math.cos(mid);
  return { pts: pts, km: Math.round(km) };
}

function pinRestart() {
  P.rounds = pinRounds(); P.round = 0; P.phase = 'intro'; P.totals = {}; P.pins = {}; P.result = null; P.hold = false;
  G.players.forEach(function (p) { P.totals[p.id] = 0; });
  P.T = +($('#pinTime') ? $('#pinTime').value : 20);
  renderPin();
}

function pinStartRound() {
  if (!P.rounds.length) return;
  P.phase = 'pin'; P.elapsed = 0; P.pins = {}; P.result = null; P.hold = false;
  P.T = +($('#pinTime') ? $('#pinTime').value : 20);
  var it = pinItem(), m = pinMeta(), t = m.markers[it.marker], rnd = rngFor(77, P.round);
  P.plan = G.players.filter(function (p) { return p.bot; }).map(function (p) {
    var far = rnd() < 0.15, sig = far ? 0.22 : 0.025 + rnd() * 0.05;
    var x = Math.min(0.98, Math.max(0.02, t.x + gauss(rnd) * sig));
    var y = Math.min(0.98, Math.max(0.02, t.y + gauss(rnd) * sig * m.w / m.h));
    return { pid: p.id, x: x, y: y, t: Math.round((2 + rnd() * 10) * Math.min(1, P.T / 16) * 10) / 10 };
  });
  renderPin();
}

function pinYou(fx, fy) {
  if (P.phase !== 'pin' || P.pins[20]) return;
  P.pins[20] = { x: fx, y: fy, t: Math.round(P.elapsed * 10) / 10 };
  renderPin();
  if (Object.keys(P.pins).length >= 21) pinReveal();
}

/** Score the round: per player points, team averages, fastest team line. */
function pinReveal() {
  if (P.phase !== 'pin') return;
  P.plan.forEach(function (a) { if (!P.pins[a.pid] && a.t <= P.elapsed + 0.01) P.pins[a.pid] = { x: a.x, y: a.y, t: a.t }; });
  var per = {}, teams = TEAMS.map(function () { return { sum: 0, n: 0, last: 0, all: true }; });
  G.players.forEach(function (p) {
    var pin = P.pins[p.id], tm = teams[p.team], s = pin ? pinScore(pin.x, pin.y) : { pts: 0, km: null };
    per[p.id] = s;
    P.totals[p.id] = (P.totals[p.id] || 0) + s.pts;
    tm.sum += s.pts; tm.n++;
    if (pin) tm.last = Math.max(tm.last, pin.t); else tm.all = false;
  });
  var avg = teams.map(function (t) { return t.n ? Math.round(t.sum / t.n) : 0; });
  var fast = teams.map(function (t, i) { return { i: i, t: t.last, all: t.all }; }).filter(function (x) { return x.all; })
    .sort(function (a, b) { return a.t - b.t; })[0];
  P.result = { per: per, avg: avg, fast: fast };
  P.phase = 'reveal';
  renderPin();
}

function pinNext() {
  if (P.phase === 'intro' || P.phase === 'end') { if (P.phase === 'end') pinRestart(); pinStartRound(); return; }
  if (P.phase === 'pin') { pinReveal(); return; }

LIVE.pinStart = function (pids) { return LIVE.pinState('pin_intro', pids, 0); };
/** The forward step from a pin state: {label, state} or null. */
LIVE.pinNextStep = function (s) {
  var n = LIVE.PIN_ROUNDS, last = (s.pids || []).length ? (s.pids.length - 1) : n - 1, r = s.round || 0;
  switch (s.phase) {
    case 'pin_intro': return { label: 'Start round 1', state: LIVE.pinState('pin_round', s.pids, 0, LIVE.pinSec * 1000) };
    case 'pin_round': return { label: 'Reveal', state: LIVE.copyAs(s, 'pin_reveal') };
    case 'pin_reveal': return { label: 'Show standings', state: LIVE.copyAs(s, 'pin_board') };
    case 'pin_board':
      if (r < last) return { label: 'Next round (' + (r + 2) + ' of ' + (last + 1) + ')', state: LIVE.pinState('pin_round', s.pids, r + 1, s.limit || LIVE.pinSec * 1000) };
      return { label: 'Final screen', state: LIVE.pinState('pin_end', s.pids) };
    case 'pin_end': return { label: 'End game', state: { phase: 'ended', kind: 'pin' } };
  }
  return null;
};
LIVE.isPin = function (s) { return !!s && String(s.phase).indexOf('pin_') === 0; };

/* ---- stage (board and host preview): Stage 1 pin renderers on server data ---- */
LIVE.pinCalc = function (b) {
  var s = b.state || {}, pins = b.pins || [], it = LIVE.pinItems(s)[s.round || 0], sum = [0, 0, 0, 0], cnt = [0, 0, 0, 0], per = [];
  pins.forEach(function (p, i) {
    var sc = it ? LIVE.pinScoreOf(it, p.x, p.y) : { pts: 0, km: 0 };
    per.push(sc);
    sum[p.t] = (sum[p.t] || 0) + sc.pts; cnt[p.t] = (cnt[p.t] || 0) + 1;
  });
  var tm = b.teams || [];
  var avg = [0, 1, 2, 3].map(function (i) { var n = tm[i] ? tm[i].n : cnt[i]; return n ? Math.round(sum[i] / n) : 0; });
  return { per: per, avg: avg, item: it };
};
LIVE.pinMapStage = function (it, m, pins, showAll, calc) {
  var sc = Math.min(1150 / m.w, 960 / m.h), bw = Math.round(m.w * sc), bh = Math.round(m.h * sc);
  var keep = { rounds: P.rounds, round: P.round, phase: P.phase, pins: P.pins, players: G.players };
  var ov;
  P.rounds = [it]; P.round = 0; P.phase = showAll ? 'reveal' : 'pin'; P.pins = {};
  G.players = [];
  if (showAll) pins.forEach(function (p, i) { P.pins[100 + i] = { x: p.x, y: p.y, t: 0 }; G.players.push({ id: 100 + i, team: p.t, name: '' }); });
  try { ov = pinOverlay(m, bw, bh); } finally { P.rounds = keep.rounds; P.round = keep.round; P.phase = keep.phase; P.pins = keep.pins; G.players = keep.players; }
  return '<div class="pin-map"><div class="mapbox" style="width:' + bw + 'px;height:' + bh + 'px;left:' + Math.round((1150 - bw) / 2) + 'px;top:' +
    Math.round((960 - bh) / 2) + 'px"><img alt="" src="' + window.MAPIMG[it.map] + '">' + ov + '</div></div>';
};
LIVE.pinStandRows = function (calc, showRound) {
  var ts = teamStats().slice().sort(function (a, b) { return b.total - a.total || a.i - b.i; });
  return '<div class="lb">' + ts.map(function (x) {
    return '<div><i style="background:' + TEAMS[x.i].color + '"></i><span>' + esc(TEAMS[x.i].name) + '</span>' +
      (showRound ? '<b>+' + calc.avg[x.i] + '</b>' : '') + '<span class="muted" style="flex:0 0 150px;text-align:right">total ' + x.total + '</span></div>';
  }).join('') + '</div>';
};
LIVE.pinBest = function (b) {
  var top = (b.top || []).slice(0, 3);
  return top.length ? '<div class="line">Best players: ' + esc(top.map(function (t) { return t.name + ' ' + t.points; }).join(', ')) + '</div>' : '';
};
LIVE.pinSideHtml = function (b, calc, it, m) {
  var s = b.state, ph = s.phase, n = (s.pids || []).length, rnd = '<div class="rnd">Round ' + ((s.round || 0) + 1) + ' of ' + n + ' \u00B7 ';
  if (ph === 'pin_round') {
    var left = LIVE.pinLeft(s);
    return rnd + 'Pin the Region</div><div class="prompt"><span class="fi">' + esc(it.prompt || 'Pin: ' + it.marker) + '</span></div>' +
      '<div class="mapname">Map: ' + esc(m.title) + '</div><div class="big gold" id="pinNum">' + left + '</div>' +
      '<div class="line" id="pinCnt">Pins locked: ' + (b.answered || 0) + ' / ' + (b.players || 0) + '</div>' +
      '<div class="you">Place your pin on the phone, then tap Lock in.</div>';
  }
  var hits = calc.per.length, near = 0, best = null, bi = -1;
  calc.per.forEach(function (x, i) { if (x.pts >= 100) near++; if (!best || x.km < best.km) { best = x; bi = i; } });
  return rnd + (ph === 'pin_board' ? 'Standings' : 'Answer') + '</div><div class="prompt"><span class="fi">' + esc(it.marker) + '</span></div>' +
    '<div class="you">' + hits + ' pins locked. Closest: ' + (best ? best.km + ' km' : 'none') + '. Spot on: ' + near + '.</div>' +
    '<h2>Team points this round</h2>' + LIVE.pinStandRows(calc, true) + LIVE.pinBest(b);
};
LIVE.pinLeft = function (s) {
  var el = typeof s.t0 === 'number' ? (CCAPI.serverNow() - s.t0) / 1000 : 0;
  return Math.max(0, Math.ceil((s.limit || 30000) / 1000 - el - 0.001));
};
LIVE.pinTickUpdate = function () {
  var s = LIVE.state, el = $('#pinNum');
  if (s && s.phase === 'pin_round' && el) el.textContent = LIVE.pinLeft(s);
};
LIVE.pinEndHtml = function (b) {
  var ts = teamStats().slice().sort(function (a, c) { return c.total - a.total || a.i - c.i; }), top = (b.top || []).slice(0, 3);
  return '<div class="abs pin-intro"><h1>Pin the Region: final</h1>' + ts.map(function (x, k) {
    return '<p>' + ordinal(k + 1) + ' <b style="color:' + TEAMS[x.i].color + '">' + esc(TEAMS[x.i].name) + '</b> ' + x.total + ' points</p>';
  }).join('') + '<p class="gold">Best players: ' + esc(top.map(function (p) { return p.name + ' ' + p.points; }).join(', ')) + '</p></div>';
};
LIVE.pinIntroHtml = function (s) {
  var items = LIVE.pinItems(s), keep = P.rounds, h;
  P.rounds = items;
  try { h = pinIntroHtml(); } finally { P.rounds = keep; }
  return h.replace(/<p class="gold">[^<]*<\/p>/, '<p class="gold">Place your pin on your own phone, then tap Lock in.</p>');
};
/** Draw the pin stage for board response b into #stage (rebuilt only when something changed). */
LIVE.renderPin = function (b) {
  var st = $('#stage'), s = b.state || {}, ph = s.phase, key, html;
  if (!st) return;
  LIVE.state = s; LIVE.teams = b.teams || null; LIVE.playerCount = b.players || 0;
  key = 'pin:' + ph + ':' + (s.round || 0) + ':' + (s.pids || []).join(',') + ':' + (ph === 'pin_round' ? '' : JSON.stringify([b.pins, b.teams, b.top]));
  if (ph === 'pin_round' && stageKey.indexOf('pin:pin_round:' + (s.round || 0) + ':') === 0) {
    var c = $('#pinCnt');
    if (c) c.textContent = 'Pins locked: ' + (b.answered || 0) + ' / ' + (b.players || 0);
    LIVE.pinTickUpdate();

  }
  if (key === stageKey) return;
  stageKey = key;
  if (ph === 'pin_intro') html = LIVE.pinIntroHtml(s);
  else if (ph === 'pin_end') html = LIVE.pinEndHtml(b);
  else {
    var calc = LIVE.pinCalc(b), it = calc.item;
    if (!it) { html = '<div class="abs pin-intro"><h1>Pin the Region</h1></div>'; }
    else {
      var m = window.MAPS[it.map], show = ph !== 'pin_round';
      html = LIVE.pinMapStage(it, m, b.pins || [], show, calc) + '<div class="pin-side">' + LIVE.pinSideHtml(b, calc, it, m) + '</div>';
    }
  }
  st.innerHTML = html + '<div class="st-corner" id="stCorner">Pin the Region</div>';
  fitText($('.pin-side .prompt', st), 64, 40);

/* ===== Host controller: the only writer of game state and team-task points. Pin extension point: LIVE.nextStep ===== */
(function () {
  LIVE.init();
  var app = $('#app'), net = $('#net');
  var code = '', pin = '', plan = LIVE.defaultPlan(), st = null, last = null, poller = null;
  var busy = false, autoReveal = true, lastOk = Date.now(), revKey = '', msg = '', open = true, built = false;

  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } return null; }
  var ERR = { pin: 'Wrong PIN.', locked: 'Too many wrong PINs. Wait 30 seconds and try again.', exists: 'That code is taken with a different PIN. Use another code.',
    bad: 'Code must be 4 letters or digits and the PIN 4 to 8 digits.', full: 'Too many games were created in the last hour.', nogame: 'Game not found.' };
  function errText(r) { return r && r.err ? (ERR[r.err] || ('Error: ' + r.err)) : 'No connection. Try again.'; }

  function setup(note) {
    built = false;
    app.innerHTML = '<div class="hs-card"><h1>Cellar Clash host</h1>' +
      '<label>Game code<input id="hc" maxlength="4" autocomplete="off" value="' + esc(code || ss('cc_h_code') || LIVE.randomCode()) + '"></label>' +
      '<label>PIN (4 to 8 digits, you choose it)<input id="hp" type="password" inputmode="numeric" maxlength="8" autocomplete="off" value="' + esc(pin) + '"></label>' +
      (BANK.pair.length ? '<label>Game<select id="hg"><option value="quiz"' + (plan.game === 'pairing' ? '' : ' selected') + '>Quiz: wine handbook</option>' +
        '<option value="pairing"' + (plan.game === 'pairing' ? ' selected' : '') + '>Pairing: what do you suggest?</option></select></label>' : '') +
      '<div class="hs-row"><label>Sets<input id="hs" type="number" min="1" max="6" value="' + plan.sets + '"></label>' +
      '<label>Questions per set<input id="hq" type="number" min="1" max="12" value="' + plan.per + '"></label>' +
      '<label>Seconds each<input id="ht" type="number" min="3" max="90" value="' + plan.sec + '"></label></div>' +
      '<div class="hs-err" id="he">' + esc(note || '') + '</div><button type="button" class="hs-prim" id="hgo">Create or resume game</button></div>';
    $('#hgo').onclick = go;
  }
  function go() {
    var c = $('#hc').value.toUpperCase().replace(/[^A-Z0-9]/g, ''), p = $('#hp').value.replace(/[^0-9]/g, '');
    plan = LIVE.normPlan({ sets: $('#hs').value, per: $('#hq').value, sec: $('#ht').value, game: $('#hg') ? $('#hg').value : 'quiz' });
    if (c.length !== 4 || p.length < 4 || p.length > 8) { $('#he').textContent = ERR.bad; return; }
    code = c; pin = p; $('#he').textContent = 'Connecting';
    enter();
  }
  function enter() {
    CCAPI.create(code, pin).then(function (r) {
      if (!r || !r.ok) { pin = r && r.err === 'pin' ? '' : pin; setup(errText(r)); return; }
      ss('cc_h_code', code); ss('cc_h_pin', pin); ss('cc_h_plan', JSON.stringify(plan));
      return CCAPI.state(code, null).then(function (s) {
        var cur = s && s.ok ? s.state : null;
        if (r.resumed && cur && cur.kind === 'pin' && cur.phase && cur.phase !== 'ended') return;
        if (r.resumed && cur && cur.kind === 'quiz' && cur.phase) { if (cur.plan) plan = LIVE.normPlan(cur.plan); return; }
        return CCAPI.hostSet(code, pin, LIVE.lobbyState(plan), null);
      }).then(function () { LIVE.code = code; control(); });
    }, function () { setup('No connection. Try again.'); });
  }
  function control() {
    built = true;
    var tb = TEAMS.map(function (t, i) {
      return '<div class="hs-tk" style="border-color:' + t.color + '"><b style="color:' + t.color + '">' + esc(t.name) + '</b> <span id="tt' + i + '">0</span>' +
        '<div class="hs-btns">' + [10, 25, 50, -10].map(function (v) { return '<button type="button" data-t="' + i + '" data-v="' + v + '">' + (v > 0 ? '+' : '') + v + '</button>'; }).join('') +
        '<input type="number" id="tn' + i + '" value="5" aria-label="points"><button type="button" data-t="' + i + '" data-n="1">Add</button></div></div>';
    }).join('');
    app.innerHTML = '<div class="hs-head"><span>Game <b id="hcode"></b></span><span id="hpl"></span><span id="hph"></span></div>' +
      '<div class="hs-main"><div class="hs-col"><button type="button" class="hs-prim" id="prim">Start game</button>' +
      '<div class="hs-row2"><button type="button" id="plus">+10 s</button><button type="button" id="skip" class="hidden">Skip tasks</button>' +
      '<label class="hs-chk"><input type="checkbox" id="auto" checked> Auto-reveal</label><label class="hs-chk"><input type="checkbox" id="opn" checked> Joining open</label></div>' +
      '<div class="hs-msg" id="hmsg"></div><div class="hs-info" id="hinfo"></div>' +
      '<div class="hs-pin hidden" id="hpin"><h2>Pin the Region</h2>' +
      '<label class="hs-chk"><input type="radio" name="hpm" id="hpm1" value="sep" checked> Separate scores (new game code)</label>' +
      '<label class="hs-chk"><input type="radio" name="hpm" id="hpm2" value="same"> Add to this game&#39;s scores</label>' +
      '<p class="hs-note">Each game can hold one Pin game. To play Pin again, choose separate scores.</p>' +
      '<label>Seconds per round<input type="number" id="hpt" min="3" max="90" value="' + LIVE.pinSec + '"></label>' +
      '<button type="button" class="hs-prim" id="hpgo">Start Pin the Region</button></div></div>' +
      '<div class="hs-col"><h2>Team task points</h2>' + tb + '</div></div>';
    $('#hcode').textContent = code;
    autoReveal = ss('cc_h_auto') !== '0'; $('#auto').checked = autoReveal;
    $('#hpgo').onclick = startPin;
    $('#prim').onclick = primary; $('#plus').onclick = plus; $('#skip').onclick = skip;
    $('#auto').onchange = function () { autoReveal = this.checked; ss('cc_h_auto', autoReveal ? '1' : '0'); };
    $('#opn').onchange = function () { setOpen(this.checked); };
    app.onclick = function (e) {
      var b = e.target;
      if (!b || !b.getAttribute || b.getAttribute('data-t') === null) return;
      var team = +b.getAttribute('data-t'), v = b.getAttribute('data-n') ? parseInt($('#tn' + team).value, 10) : +b.getAttribute('data-v');
      if (isNaN(v) || v === 0 || v < -500 || v > 500) { say('Points must be between -500 and 500.'); return; }
      CCAPI.hostPoints(code, pin, team, v, 'Task').then(function (r) { if (!r || !r.ok) say(errText(r)); else { say(TEAMS[team].name + ' ' + (v > 0 ? '+' : '') + v); refresh(); } }, function () { say('No connection.'); });
    };
    if (poller) poller.stop();
    poller = CCAPI.poll(function () { return CCAPI.board(code); }, LIVE.pollMs(1000), onData, function () { /* banner by timer */ });
    window.addEventListener('resize', layoutPrev);
    layoutPrev();
  }
  function pinSecs() { var v = parseInt($('#hpt').value, 10); return isNaN(v) ? 30 : Math.max(3, Math.min(90, v)); }
  function startPin() {
    if (busy) return;
    LIVE.pinSec = pinSecs();
    var same = $('#hpm2').checked, pids = LIVE.pinChoose(), s0 = LIVE.pinStart(pids);
    if (same) { write(s0); return; }
    var nc = LIVE.randomCode(), np = String(1000 + Math.floor(Math.random() * 9000)), oc = code, op = pin, os = st;
    busy = true;
    CCAPI.create(nc, np).then(function (r) {
      if (!r || !r.ok) { busy = false; say(errText(r)); return; }
      return CCAPI.hostSet(nc, np, s0, null).then(function (r2) {
        busy = false;
        if (!r2 || !r2.ok) { say(errText(r2)); return; }
        /* the old game stays readable but is closed, so phones and the board never fall back to it */
        if (oc && os && os.phase) CCAPI.hostSet(oc, op, LIVE.copyAs(os, os.phase), false).then(function () { }, function () { });
        code = nc; pin = np; LIVE.code = code; revKey = '';
        ss('cc_h_code', code); ss('cc_h_pin', pin);
        $('#hcode').textContent = code; say('New game ' + code);
        if (poller) poller.stop();
        poller = CCAPI.poll(function () { return CCAPI.board(code); }, LIVE.pollMs(1000), onData, function () { });
        refresh();
      });
    }, function () { busy = false; say('No connection.'); });
  }
  function say(t) { msg = t; var m = $('#hmsg'); if (m) m.textContent = t; }
  function layoutPrev() {
    var w = Math.min(480, Math.max(240, (document.documentElement.clientWidth || window.innerWidth) - 24)), wrap = $('#stageWrap');
    if (wrap) scaleInto(wrap, $('#stage'), 1920, 1080, w / 1920);
  }
  function write(state, op) {
    if (busy) return;
    busy = true;
    CCAPI.hostSet(code, pin, state, op === undefined ? null : op).then(function (r) {
      busy = false;
      if (!r || !r.ok) { say(errText(r)); revKey = ''; return; }
      say(''); refresh();
    }, function () { busy = false; revKey = ''; say('No connection. Nothing was changed.'); });
  }
  function primary() {
    if (!st) return;
    var n = LIVE.nextStep(st, code);
    if (n) write(n.state);
  }
  function plus() { if (st && (st.phase === 'question' || st.phase === 'pin_round')) { var s2 = LIVE.copyAs(st, st.phase); s2.limit = (st.limit || 20000) + 10000; write(s2); } }
  function skip() { var s = st && LIVE.skipTasks(st, code); if (s) write(s); }
  function setOpen(v) { if (st) { open = v; write(LIVE.copyAs(st, st.phase), v); } }
  function refresh() { CCAPI.board(code).then(onData, function () { /* poll will retry */ }); }
  function onData(r) {
    if (!r || !r.ok) { if (r && r.err === 'nogame') say('Game not found on the server.'); return; }
    lastOk = Date.now(); last = r; st = r.state || {};
    LIVE.apply(r);
    layoutPrev();
    var n = LIVE.nextStep(st, code), ph = st.phase;
    $('#prim').textContent = n ? n.label : 'Game finished';
    $('#prim').disabled = !n;
    $('#plus').className = (ph === 'question' || ph === 'pin_round') ? '' : 'hidden';
    var hp = $('#hpin'); if (hp) hp.className = 'hs-pin' + ({ lobby: 1, podium: 1, ended: 1, pin_end: 1, pin_board: 1 }[ph] ? '' : ' hidden');
    $('#skip').className = LIVE.skipTasks(st, code) ? '' : 'hidden';
    $('#hpl').textContent = r.players + ' players';
    var PHL = { lobby: 'Lobby', question: 'Question', reveal: 'Answer', board: 'Standings', tasks: 'Team tasks', podium: 'Final result', pin_intro: 'Pin the Region intro', pin_round: 'Pin round ' + ((st.round || 0) + 1), pin_reveal: 'Pin answer', pin_board: 'Pin standings', pin_end: 'Pin the Region final', ended: 'Ended' };
    $('#hph').textContent = (PHL[ph] || ph) + (ph === 'question' || ph === 'pin_round' ? ' (' + r.answered + ' of ' + r.players + ' answered)' : '');
    var t = (r.teams || []);
    TEAMS.forEach(function (x, i) { var e = $('#tt' + i); if (e && t[i]) e.textContent = (t[i].tasks || 0) + ' pts (' + t[i].n + ' players)'; });
    var inf = $('#hinfo');
    if (inf) inf.textContent = ph === 'question' ? 'Set ' + ((st.set || 0) + 1) + ', question ' + ((st.qi || 0) + 1) + ' of ' + LIVE.normPlan(st.plan).per : (ph === 'lobby' ? 'Players join with the code ' + code : '');
    checkAuto();
  }
  function checkAuto() {
    if (!autoReveal || !st || (st.phase !== 'question' && st.phase !== 'pin_round') || busy) return;
    var isP = st.phase === 'pin_round', key = (isP ? 'p' : 'q') + st.round, over = typeof st.t0 === 'number' && CCAPI.serverNow() - st.t0 >= (st.limit || 20000);
    var all = last && last.players > 0 && last.answered >= last.players;
    if (revKey === key || !(over || all)) return;
    revKey = key;
    setTimeout(function () {
      if (!st || st.phase !== (isP ? 'pin_round' : 'question') || (isP ? 'p' : 'q') + st.round !== key || !autoReveal) { if (revKey === key) revKey = ''; return; }
      var s = LIVE.copyAs(st, isP ? 'pin_reveal' : 'reveal');
      busy = false; write(s);
    }, 1000);
  }
  document.addEventListener('keydown', function (e) {
    var tg = e.target && e.target.tagName;
    if ((e.key === ' ' || e.code === 'Space') && built && tg !== 'INPUT' && tg !== 'BUTTON') { e.preventDefault(); primary(); }
  });
  setInterval(function () {
    if (built) { net.className = 'hs-net' + (Date.now() - lastOk > 15000 ? '' : ' hidden'); checkAuto(); LIVE.tickTimer(); }
  }, 500);
  window.LIVE_HOST = { state: function () { return { code: code, st: st, last: last }; } };
  var sc = ss('cc_h_code'), sp = ss('cc_h_pin'), spl = ss('cc_h_plan');
  if (sc && sp) {
    code = sc; pin = sp;
    try { if (spl) plan = LIVE.normPlan(JSON.parse(spl)); } catch (e) { /* ignore */ }
    enter();
  } else setup('');
})();
